- name: Install MinGW
  shell: bash
  run: |
    sudo apt-get update
    sudo apt-get install -y mingw-w64

- name: Build Windows EXEs with MinGW
  shell: bash
  run: |
    set -euo pipefail
    mkdir -p build-win

    find . -type f -name '*.c' ! -path './.git/*' ! -path './build*' -print0 |
    while IFS= read -r -d '' file; do
      case "$file" in
        *.exe|*.out|./build*|*/build/*)
          continue
          ;;
      esac

      if ! grep -Eq '^[[:space:]]*(int|void)[[:space:]]+main[[:space:]]*\(' "$file"; then
        echo "Skipping $file (no main)"
        continue
      fi

      rel="${file#./}"
      out="build-win/$(printf '%s' "$rel" | sed -E 's/[\\/]+/_/g; s/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//').exe"

      echo "Compiling $rel -> $out"
      mkdir -p "$(dirname "$out")"
      x86_64-w64-mingw32-gcc -O2 -std=c11 "$file" -o "$out"
    done

    echo "Built:"
    find build-win -type f -name '*.exe' | sort
