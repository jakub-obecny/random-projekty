name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64

      - name: Build all C programs into separate Linux and Windows folders
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/linux build/windows
          shopt -s nullglob

          built_linux=0
          built_windows=0
          failed=0

          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.out|./build/*)
                continue
                ;;
            esac

            if ! grep -Eq '^[[:space:]]*(int|void)[[:space:]]+main[[:space:]]*\(' "$file"; then
              echo "Skipping $file (no main function)"
              continue
            fi

            rel="${file#./}"

            linux_rel="${rel#./}"
            linux_out="build/linux/$(printf '%s' "$linux_rel" | sed -E 's/[\/]+/_/g; s/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//')"

            windows_rel="${rel#./}"
            windows_out="build/windows/$(printf '%s' "$windows_rel" | sed -E 's/[\/]+/_/g; s/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//').exe"

            echo "Compiling Linux: $rel -> $linux_out"
            mkdir -p "$(dirname "$linux_out")"
            compile_log="$(mktemp)"
            if gcc -Wall -Wextra -Wno-unknown-pragmas -Wno-ignored-pragmas -std=c11 -fopenmp "$file" -lm -o "$linux_out" >"$compile_log" 2>&1; then
              built_linux=$((built_linux + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Linux compile failed for $rel"
              cat "$compile_log"
            fi
            rm -f "$compile_log"

            echo "Compiling Windows: $rel -> $windows_out"
            mkdir -p "$(dirname "$windows_out")"
            compile_log="$(mktemp)"
            if x86_64-w64-mingw32-gcc -Wall -Wextra -Wno-unknown-pragmas -Wno-ignored-pragmas -std=c11 -fopenmp "$file" -lm -o "$windows_out" >"$compile_log" 2>&1; then
              built_windows=$((built_windows + 1))
            else
              echo "::warning::Windows compile failed for $rel"
              cat "$compile_log"
            fi
            rm -f "$compile_log"

            echo
          done < <(find . -type f -name '*.c' ! -path './.git/*' ! -path './build/*' -print0)

          echo "Summary:"
          echo "  Linux builds: $built_linux"
          echo "  Windows builds: $built_windows"
          echo "  Failed files: $failed"

          if [ "$built_linux" -eq 0 ] && [ "$built_windows" -eq 0 ]; then
            echo "No C programs with main() were successfully built."
            exit 0
          fi

          echo "Linux outputs:"
          find build/linux -type f | sort

          echo
          echo "Windows outputs:"
          find build/windows -type f -name '*.exe' | sort
          echo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c-builds
          path: |
            build/linux/*
            build/windows/*.exe
          if-no-files-found: warn

      - name: Commit generated build outputs to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build

          if git diff --cached --quiet; then
            echo "No build outputs changed."
            exit 0
          fi

          git commit -m "chore: build C executables [skip ci]"
          git push origin HEAD:main
