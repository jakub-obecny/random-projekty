name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Check C source files compile
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            gcc -Wall -Wextra -std=c11 -fsyntax-only "$file"
          done < <(find . -type f -name "*.c" ! -name "*.exe" -print0)
