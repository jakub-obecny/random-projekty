name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build all C programs into .exe files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          shopt -s nullglob

          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.out|./build/*)
                continue
                ;;
            esac

            case "$file" in
              *"/game of life/"*|*"/mandelbrot "*|*"/mandelbrot ("*|*"/mandelbrot_"*)
                continue
                ;;
            esac

            if ! grep -Eq '^[[:space:]]*(int|void)[[:space:]]+main[[:space:]]*\(' "$file"; then
              echo "Skipping $file (no main function)"
              continue
            fi

            rel="${file#./}"
            out="build/$(printf '%s' "$rel" | sed -E 's/[\/]+/_/g; s/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//').exe"

            mkdir -p "$(dirname "$out")"
            echo "Compiling $rel -> $out"
            gcc -Wall -Wextra -Wno-unknown-pragmas -Wno-ignored-pragmas -std=c11 "$file" -o "$out"
          done < <(find . -type f -name '*.c' ! -path './.git/*' ! -path './build/*' -print0)

          if [ -z "$(find build -type f -name '*.exe' -print -quit)" ]; then
            echo "No C executables were produced."
            exit 0
          fi

          echo "Built executables:"
          find build -type f -name '*.exe' -printf '%P\n' | sort
