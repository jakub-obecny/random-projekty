name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build all C executables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          shopt -s nullglob

          compiled=0

          while IFS= read -r file; do
            case "$file" in
              *.exe|*.out|*/build/*)
                continue
                ;;
            esac

            if ! grep -Eq '^[[:space:]]*(int|void)[[:space:]]+main[[:space:]]*\(' "$file"; then
              echo "Skipping $file (no main function)"
              continue
            fi

            safe_name=$(printf '%s' "$file" | sed -E 's/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//')
            out="build/${safe_name%.*}.exe"

            echo "Compiling $file -> $out"
            gcc -Wall -Wextra -Wno-unknown-pragmas -Wno-ignored-pragmas -std=c11 "$file" -o "$out"
            compiled=$((compiled + 1))
          done < <(git ls-files '*.c')

          if [ "$compiled" -eq 0 ]; then
            echo "No C programs with main() found in the repository."
            exit 0
          fi

          echo "Built $compiled C executable(s) successfully."
          ls -1 build
