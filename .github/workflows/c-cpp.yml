name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Check C source files compile
        shell: bash
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.out)
                continue
                ;;
            esac

            found=1
            echo "Checking $file"
            gcc -Wall -Wextra -Wno-unknown-pragmas -Wno-ignored-pragmas -std=c11 -c "$file" -o /tmp/ci-check.o
          done < <(find . -type f -name '*.c' -print0)

          if [ "$found" -eq 0 ]; then
            echo "No C files found in the repository."
            exit 0
          fi

          echo "All C files compile successfully."
