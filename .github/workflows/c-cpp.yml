name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Check C source files compile
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(git ls-files -z '*.c')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C files found in the repository."
            exit 0
          fi

          for file in "${files[@]}"; do
            case "$file" in
              *.exe)
                continue
                ;;
            esac

            echo "Checking $file"
            gcc -Wall -Wextra -std=c11 -fsyntax-only "$file"
          done
