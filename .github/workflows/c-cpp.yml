name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build all C files to Windows EXEs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          find . -type f -name '*.c' ! -path './.git/*' ! -path './build/*' -print0 |
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.out|./build/*)
                continue
                ;;
            esac

            if ! grep -Eq '^[[:space:]]*(int|void)[[:space:]]+main[[:space:]]*\(' "$file"; then
              echo "Skipping $file (no main)"
              continue
            fi

            rel="${file#./}"
            out="build/$(printf '%s' "$rel" | sed -E 's/[\\/]+/_/g; s/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//').exe"

            echo "Compiling $rel -> $out"
            mkdir -p "$(dirname "$out")"
            gcc -Wall -Wextra -std=c11 "$file" -o "$out"
          done

          echo "Generated files:"
          find build -type f -name '*.exe' -printf '%P\n' | sort
